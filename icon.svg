<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111424"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Calendar Card -->
  <g transform="translate(96, 90)">
    <!-- Calendar Body Glass -->
    <rect x="0" y="32" width="320" height="270" rx="36" fill="#181d2e" stroke="rgba(255,255,255,0.14)" stroke-width="4"/>

    <!-- Calendar Top Bar -->
    <path d="M 0 68 C 0 50 14 32 36 32 L 284 32 C 306 32 320 50 320 68 L 320 102 L 0 102 Z" fill="url(#brandGrad)"/>

    <!-- Calendar Ring Hooks -->
    <rect x="68" y="10" width="24" height="48" rx="12" fill="#cbd5e1" stroke="#090a10" stroke-width="4"/>
    <rect x="228" y="10" width="24" height="48" rx="12" fill="#cbd5e1" stroke="#090a10" stroke-width="4"/>

    <!-- Calendar Grid Dots -->
    <circle cx="72" cy="144" r="10" fill="rgba(255,255,255,0.2)"/>
    <circle cx="128" cy="144" r="10" fill="rgba(255,255,255,0.2)"/>
    <circle cx="184" cy="144" r="10" fill="rgba(255,255,255,0.2)"/>
    <circle cx="240" cy="144" r="10" fill="rgba(255,255,255,0.2)"/>

    <circle cx="72" cy="192" r="10" fill="rgba(255,255,255,0.2)"/>
    <circle cx="128" cy="192" r="10" fill="rgba(255,255,255,0.2)"/>

    <!-- Camera Lens Badge Overlap -->
    <g transform="translate(140, 150)">
      <!-- Outer Glow circle -->
      <circle cx="70" cy="70" r="64" fill="#0c0e18" stroke="url(#brandGrad)" stroke-width="6" filter="url(#glow)"/>
      <circle cx="70" cy="70" r="50" fill="rgba(99,102,241,0.18)"/>
      <circle cx="70" cy="70" r="32" fill="url(#lensGrad)"/>
      <circle cx="62" cy="62" r="10" fill="#ffffff" opacity="0.6"/>
      <!-- Sparkle -->
      <path d="M 120 14 Q 120 28 134 28 Q 120 28 120 42 Q 120 28 106 28 Q 120 28 120 14 Z" fill="#06b6d4"/>
    </g>
  </g>
</svg>
